name: Documentation integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local documentation links
        run: python scripts/check_links.py
